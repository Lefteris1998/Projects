<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1036" />
  <title>Join Quip Brawl</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%277%27 fill=%27%23ffd23f%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="phone">
  <main>
    <div class="top">
      <p class="logo"><b>Quip</b> <i>Brawl</i></p>
      <div class="me" id="me"></div>
    </div>

    <form class="screen" id="join-form" autocomplete="off">
      <h1>Join a game</h1>
      <div>
        <label for="code">Room code</label>
        <input id="code" class="code" maxlength="4" inputmode="text" autocapitalize="characters" placeholder="ABCD" required>
      </div>
      <div>
        <label for="name">Your name</label>
        <input id="name" maxlength="12" placeholder="Max 12 letters" required>
      </div>
      <button class="btn" type="submit" id="join-btn">Join</button>
      <div class="error" id="join-error"></div>
    </form>

    <section class="screen hidden" id="game"></section>
  </main>
  <script src="play.js"></script>
</body>
</html>
