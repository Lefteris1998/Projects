<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quip Brawl</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect x=%272%27 y=%272%27 width=%2712%27 height=%2712%27 fill=%27%23c4121f%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
  <link rel="stylesheet" href="style.css">
  <!-- Material Design 3 components (Google's @material/web), same version as the other projects -->
  <script type="module">import 'https://cdn.jsdelivr.net/npm/@material/web@2.4.1/all.js/+esm';</script>
  <style id="page-transition">
    /* smooth hand-off between the projects page and each project (cross-document view transitions, Chrome/Edge):
       the old page sinks away into a blur while the new one eases in from the dark */
    @view-transition { navigation: auto; }
    ::view-transition-group(root) { animation-duration: 0.8s; }
    ::view-transition-old(root) { animation: pt-out 0.45s ease-in both; }
    ::view-transition-new(root) { animation: pt-in 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    @keyframes pt-out { to { opacity: 0; filter: blur(6px); } }
    @keyframes pt-in { from { opacity: 0; transform: scale(1.035); filter: blur(10px); } }
    @media (prefers-reduced-motion: reduce) { ::view-transition-old(root), ::view-transition-new(root) { animation: none; } }
  </style>
</head>
<body class="host">
  <main>
    <header>
      <div class="brand">
        <md-filled-tonal-icon-button class="back" id="back" href="../" aria-label="All projects" title="All projects" hidden><md-icon>arrow_back</md-icon></md-filled-tonal-icon-button>
        <h1 class="logo" id="logo"><span class="fallback">Quip Brawl</span></h1>
      </div>
      <div class="meta" id="meta"></div>
    </header>
    <section class="stage" id="stage"><h2>Opening a room…</h2></section>
  </main>
  <canvas id="cursor" popover="manual" aria-hidden="true"></canvas>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="host.js"></script>
  <script>
    // back arrow only when this is running inside the Projects hub
    if (location.pathname.includes('/quip-brawl/')) document.getElementById('back').hidden = false;
  </script>
  <!-- shared with the Projects page and Haunt Filter; the page still works (plain logo, normal cursor) without them -->
  <script src="../haunt-filter/pixel-logo.js"></script>
  <script src="../haunt-filter/cursor.js"></script>
  <script>
    if (window.pixelLogo) {
      const logo = document.getElementById('logo'), cv = document.createElement('canvas');
      cv.setAttribute('aria-hidden', 'true'); logo.append(cv); logo.classList.add('live');
      pixelLogo(cv, { text: 'QUIP BRAWL', cell: 3, pad: 10, height: () => Math.max(30, Math.min(46, innerWidth * 0.032)) });
    }
  </script>
</body>
</html>
